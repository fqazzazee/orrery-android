name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GJS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gjs
      # The orbital math, the mission paths and the cards in lib/, which the
      # Android app shares.
      - name: Unit tests
        run: make test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Debug build and lint
        run: make apk-debug ANDROID_HOME="$ANDROID_HOME" JAVA_HOME="$JAVA_HOME_21_X64"
      - name: Lint report
        if: failure()
        run: cat android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      # To try a change on a phone: a debug build, signed with the runner's
      # throwaway debug key.
      - uses: actions/upload-artifact@v4
        with:
          name: orrery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
